site_name: "Suvaria Player Portal"
site_description: "Player-facing handouts, places, and campaign rules for Suvaria."
site_url: "https://blakewrege.github.io/Suvaria-Handouts/"
repo_url: "https://github.com/blakewrege/Suvaria-Handouts"
repo_name: "Suvaria-Handouts"
edit_uri: ""
theme:
  name: mkdocs
  nav_style: dark
plugins:
  - search
markdown_extensions:
